name: redo
on:
  workflow_dispatch:
    inputs:
      parts: { description: 'JSON list of part numbers', required: true }
      prev_run: { description: 'run id with the good parts', required: true }
permissions:
  actions: read
  contents: read
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: render part
        run: |
          N=1890; P=20; i=${{ matrix.part }}
          S=$(( i*N/P )); E=$(( (i+1)*N/P - 1 ))
          npx remotion render src/index.ts MolassesShort out/p_$(printf %02d $i).mp4 --gl=swangle --frames=$S-$E --crf 18 --concurrency=4 --timeout=300000 --log=error
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/*.mp4
          retention-days: 3
  join:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
          pattern: part-*
          run-id: ${{ inputs.prev_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
          pattern: part-*
      - run: |
          ls parts
          [ $(ls parts/*.mp4 | wc -l) -eq 20 ] || { echo "missing parts"; exit 1; }
          ls parts/*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -i audio/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart molasses_final.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 molasses_final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: molasses_final
          path: molasses_final.mp4
          retention-days: 7
